name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  lint-sql:
    name: Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: SQLFluff lint
        run: uv run sqlfluff lint dbt/models --dialect bigquery

  dbt:
    name: dbt parse and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt parse
        working-directory: dbt
        run: uv run dbt parse --target ci

      - name: dbt compile
        working-directory: dbt
        run: uv run dbt compile --target ci

  leakage-guard:
    name: Leakage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check no banned columns in the feature list
        run: uv run python scripts/check_leakage.py